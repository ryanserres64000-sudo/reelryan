# Prints the TestFlight crash reports (the ones testers chose to share) with their crash logs.
# Actions → « Plantages TestFlight » → Run workflow. Uses the App Store Connect key of « App iPhone ».
name: Plantages TestFlight
on: workflow_dispatch
jobs:
  crashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"
        env: { ASC_API_KEY_P8: "${{ secrets.ASC_API_KEY_P8 }}" }
      - run: node scripts/testflight-crashes.mjs
        env:
          ASC_KEY_PATH: "${{ runner.temp }}/asc.p8"
          ASC_KEY_ID: "${{ secrets.ASC_API_KEY_ID }}"
          ASC_ISSUER_ID: "${{ secrets.ASC_API_ISSUER_ID }}"
