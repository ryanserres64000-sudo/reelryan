# Checks the production montage server from outside (scripts/diag/montage.mjs). Runs on each push of the
# script to the work branch, or by hand from Actions.
name: Diagnostic serveur
on:
  push:
    branches: [claude/project-thread-7n6csp]
    paths: [scripts/diag/**, .github/workflows/diag-serveur.yml]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/diag/montage.mjs
        env:
          MADA_API_URL: "${{ secrets.MADA_API_URL }}"
          MADA_ACCESS: "${{ secrets.MADA_ACCESS }}"
          DIAG_REEL: "1"
