# Builds the iPhone app on Expo's servers (EAS Build, no Mac needed) and sends it to TestFlight.
# Run it from GitHub: Actions → « App iPhone » → Run workflow. Secrets to add once in the repository
# settings (Settings → Secrets and variables → Actions), see app/README.md « Compiler sans Mac » :
#   EXPO_TOKEN          expo.dev → Account settings → Access tokens
#   ASC_API_KEY_P8      the .p8 file of an App Store Connect API key (role Admin), its whole text
#   ASC_API_KEY_ID      the key id shown next to it
#   ASC_API_ISSUER_ID   the issuer id shown above the keys
#   APPLE_TEAM_ID       developer.apple.com → Membership → Team ID
#   MADA_API_URL        the production site, e.g. https://reelryan.vercel.app
#   MADA_ACCESS         APP_PASSWORD of the server, if one is set (else leave it empty)
name: App iPhone
on:
  workflow_dispatch:
    inputs:
      profil:
        description: "production (TestFlight), simulateur (vérifie que le code natif compile, sans compte Apple), envoi-seul (envoie sur TestFlight le dernier build déjà compilé) ou plantages (affiche les rapports de plantage partagés depuis TestFlight)"
        type: choice
        options: [production, simulateur, envoi-seul, plantages]
        default: production
      submit:
        description: "Envoyer sur TestFlight après la compilation"
        type: boolean
        default: true
      mac_github:
        description: "Compiler sur un Mac de GitHub (eas build --local) au lieu des serveurs d'Expo : ne compte pas dans les builds Expo du mois"
        type: boolean
        default: false
jobs:
  # The crash reports testers shared from TestFlight, with their logs (scripts/testflight-crashes.mjs).
  plantages:
    if: inputs.profil == 'plantages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"
        env: { ASC_API_KEY_P8: "${{ secrets.ASC_API_KEY_P8 }}" }
      - run: node scripts/testflight-crashes.mjs
        env:
          ASC_KEY_PATH: "${{ runner.temp }}/asc.p8"
          ASC_KEY_ID: "${{ secrets.ASC_API_KEY_ID }}"
          ASC_ISSUER_ID: "${{ secrets.ASC_API_ISSUER_ID }}"
  build:
    if: inputs.profil != 'plantages'
    # The free Expo plan has a few iOS builds a month (used up on 29 octobre 2026): with mac_github the
    # app is compiled here, on GitHub's macOS runner with Xcode, and only sent through Expo/App Store Connect.
    runs-on: ${{ inputs.mac_github && 'macos-latest' || 'ubuntu-latest' }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && (cd .. && npm ci)
      - name: Checks (types, hard-coded values, tests)
        run: npx tsc --noEmit -p . && node ../design/check-hardcoded.mjs && (cd .. && npm test)
      # The build runs on Expo's servers, which do not see this job's variables: the server address,
      # « Se connecter avec Apple » once the capability is on (variable MADA_APPLE_SIGNIN=1), and the App
      # Store Connect key used to send to TestFlight, go into eas.json for this run only.
      - name: Server address for the app
        run: node -e 'const f="eas.json",j=JSON.parse(require("fs").readFileSync(f));const e=Object.fromEntries([["EXPO_PUBLIC_MADA_API",process.env.API],["EXPO_PUBLIC_MADA_ACCESS",process.env.ACCESS],["EXPO_PUBLIC_APPLE_SIGNIN",process.env.APPLE]].filter(x=>x[1]));const b=j.build[process.env.PROFIL=="envoi-seul"?"production":process.env.PROFIL];if(b&&Object.keys(e).length)b.env={...b.env,...e};if(process.env.KEY_ID){j.submit.production.ios={...j.submit.production.ios,ascApiKeyPath:process.env.RUNNER_TEMP+"/asc.p8",ascApiKeyId:process.env.KEY_ID,ascApiKeyIssuerId:process.env.ISSUER_ID}};require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
        env: { PROFIL: "${{ inputs.profil }}", API: "${{ secrets.MADA_API_URL }}", ACCESS: "${{ secrets.MADA_ACCESS }}", APPLE: "${{ vars.MADA_APPLE_SIGNIN }}", KEY_ID: "${{ secrets.ASC_API_KEY_ID }}", ISSUER_ID: "${{ secrets.ASC_API_ISSUER_ID }}" }
      - name: App Store Connect key
        if: inputs.profil != 'simulateur'
        run: printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"
        env: { ASC_API_KEY_P8: "${{ secrets.ASC_API_KEY_P8 }}" }
      # Installs eas-cli once (cached) and logs in with the token.
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - name: Link the Expo project
        run: eas init --non-interactive --force
      # EXPO_USE_PRECOMPILED_MODULES=0 (eas.json): Expo modules are compiled from source with the app.
      # Build 1.0.0 (2) used precompiled ones and crashed at launch: ExpoFileSystem had been built
      # against another ExpoModulesCore (« Symbol not found … EventEmitter … eventRuntime »).
      # EAS packs the repository from git (the app reads ../core): the two edits above are committed
      # in this runner only, never pushed.
      - name: Commit the build settings locally
        run: git -c user.name=ci -c user.email=ci@localhost commit -qam "build settings" || true
      - name: Newest Xcode on the GitHub Mac
        if: inputs.mac_github
        run: |
          x=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$x" && xcodebuild -version
      - name: Build on the GitHub Mac, then send to TestFlight
        if: inputs.mac_github && inputs.profil != 'envoi-seul'
        run: |
          eas build --platform ios --profile ${{ inputs.profil }} --non-interactive --local --output "$RUNNER_TEMP/mada.ipa"
          if [ "${{ inputs.profil == 'production' && inputs.submit }}" = "true" ]; then
            eas submit --platform ios --profile production --path "$RUNNER_TEMP/mada.ipa" --non-interactive
          fi
        env:
          EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}"
          EXPO_ASC_API_KEY_PATH: "${{ runner.temp }}/asc.p8"
          EXPO_ASC_KEY_ID: "${{ secrets.ASC_API_KEY_ID }}"
          EXPO_ASC_ISSUER_ID: "${{ secrets.ASC_API_ISSUER_ID }}"
          EXPO_APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}"
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      - name: Build (and submit)
        if: ${{ !inputs.mac_github && inputs.profil != 'envoi-seul' }}
        run: eas build --platform ios --profile ${{ inputs.profil }} --non-interactive --wait ${{ inputs.profil == 'production' && inputs.submit && '--auto-submit' || '' }}
        env:
          EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}"
          EXPO_ASC_API_KEY_PATH: "${{ runner.temp }}/asc.p8"
          EXPO_ASC_KEY_ID: "${{ secrets.ASC_API_KEY_ID }}"
          EXPO_ASC_ISSUER_ID: "${{ secrets.ASC_API_ISSUER_ID }}"
          EXPO_APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}"
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      - name: Send the latest build to TestFlight
        if: inputs.profil == 'envoi-seul'
        run: eas submit --platform ios --profile production --latest --non-interactive
        env:
          EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}"
          EXPO_ASC_API_KEY_PATH: "${{ runner.temp }}/asc.p8"
          EXPO_ASC_KEY_ID: "${{ secrets.ASC_API_KEY_ID }}"
          EXPO_ASC_ISSUER_ID: "${{ secrets.ASC_API_ISSUER_ID }}"
          EXPO_APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}"
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
